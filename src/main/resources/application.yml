spring:
  application:
    name: dianzhanggui
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dianzhanggui}
    username: ${DB_USERNAME:dianzhanggui}
    password: ${DB_PASSWORD:dianzhanggui}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

auth:
  jwt:
    issuer: dianzhanggui
    secret: ${JWT_SECRET:dianzhanggui-development-jwt-secret-key-2026}
    access-token-expiration: PT15M
    refresh-token-expiration: P7D
