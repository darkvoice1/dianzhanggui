name: dianzhanggui

services:
  postgres:
    image: postgres:16-alpine
    container_name: dianzhanggui-postgres
    environment:
      POSTGRES_DB: dianzhanggui
      POSTGRES_USER: dianzhanggui
      POSTGRES_PASSWORD: dianzhanggui
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dianzhanggui -d dianzhanggui"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
